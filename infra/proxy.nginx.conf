server {
	listen 80;
	server_name _;

	# The container listens on 80 but is reached through a mapped host port
	# (8082) - nginx's own redirects default to an absolute URL built from
	# $host, which excludes the port. Relative redirects let the browser
	# resolve against whatever origin it's actually using.
	absolute_redirect off;

	# Same-origin proxy to the Frappe backend, mirroring production's Traefik
	# PathPrefix routing (edupro_school_fees' ADR 0006): Frappe claims /app,
	# /api, /assets, /files, /private - edupro-theme's own vite.config.ts dev
	# proxy uses this same list. Session cookie stays same-origin this way -
	# no CORS/SameSite fighting with the SPA.
	location /api/ {
		proxy_pass http://frappe:8000;
		proxy_set_header Host avondale.localhost;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cookie_path / /;
	}

	location /app {
		proxy_pass http://frappe:8000;
		proxy_set_header Host avondale.localhost;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cookie_path / /;
	}

	location /assets/ {
		proxy_pass http://frappe:8000;
		proxy_set_header Host avondale.localhost;
	}

	location /private/ {
		proxy_pass http://frappe:8000;
		proxy_set_header Host avondale.localhost;
	}

	location /printview {
		proxy_pass http://frappe:8000;
		proxy_set_header Host avondale.localhost;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cookie_path / /;
	}

	location /files/ {
		proxy_pass http://frappe:8000;
		proxy_set_header Host avondale.localhost;
	}

	# Everything else (including /theme-assets/) goes to edupro-theme's own
	# static SPA server - it falls back to index.html for client-side routes.
	location / {
		proxy_pass http://web:80;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
