services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped

  frappe:
    image: frappe/bench:latest
    entrypoint: ["bash", "-c", "sleep infinity"]
    restart: unless-stopped
    working_dir: /home/frappe
    environment:
      - SHELL=/bin/bash
    volumes:
      - bench-data:/home/frappe
      # The Frappe app root is the repo root itself (setup.py/requirements.txt/
      # package.json live there, as siblings of edupro_school_fees/, docs/)
      # - not the inner edupro_school_fees/ module folder.
      - ..:/home/frappe/edupro_school_fees-src
    ports:
      - "8000:8000"
      - "9000-9010:9000-9010"
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  web:
    build:
      context: ../edupro-theme
    restart: unless-stopped
    depends_on:
      - frappe

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./proxy.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
    depends_on:
      - web
      - frappe

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mariadb-data:
  bench-data:
