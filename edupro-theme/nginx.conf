server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Long-cache hashed bundle assets; index.html itself must always revalidate.
    location /theme-assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # TanStack Router client-side routing -- unknown paths fall back to
    # index.html rather than a raw 404, since routing happens in JS.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
