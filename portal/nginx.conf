server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Same-origin proxy to the Frappe backend, mirroring the Vite dev-server
	# proxy in astro.config.mjs - keeps the session cookie same-origin from
	# the browser's point of view so there's no CORS/SameSite fighting.
	location /api/ {
		proxy_pass http://frappe:8000;
		proxy_set_header Host avondale.localhost;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cookie_path / /;
	}

	# Same-origin print/PDF: the Print/Download-PDF actions link straight
	# into Frappe's own www/printview.py page and its "Get PDF" endpoint -
	# proxying them keeps the portal's session cookie valid there too,
	# instead of bouncing the browser to a different, unauthenticated origin.
	location /printview {
		proxy_pass http://frappe:8000;
		proxy_set_header Host avondale.localhost;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cookie_path / /;
	}

	location /files/ {
		proxy_pass http://frappe:8000;
		proxy_set_header Host avondale.localhost;
	}

	location / {
		try_files $uri $uri.html $uri/ =404;
	}
}
